services:
  # Backend Web Service
  - type: web
    name: hacktracker-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: APIFY_API_TOKEN
        value: apify_api_LsL1kWSh2sxL5xzRHMVBQWEFFJaDM04bNdkp
      - key: CLIENT_URL
        value: https://hacktracker.vercel.app

  # Frontend Static Web App (Alternative to Vercel)
  - type: web
    name: hacktracker-web
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hacktracker-api
          property: host
